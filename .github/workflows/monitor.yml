name: F95 Spanish Monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write # ESTO ES NUEVO: Le da permiso al bot para modificar el repo

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests python-telegram-bot==21.4 beautifulsoup4 lxml

      - name: Run F95 Monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py

      # ESTOS PASOS NUEVOS GUARDAN EL ARCHIVO memoria.json EN GITHUB
      - name: Guardar memoria de juegos enviados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add memoria.json
          git commit -m "Actualizar memoria de juegos enviados [skip ci]" || echo "No hay cambios en la memoria, omitiendo commit."
          git push
